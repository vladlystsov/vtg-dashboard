<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: установка на домашний экран (Android/desktop) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS: иконка и полноэкранный режим без Safari-интерфейса -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VTG Dashboard" />
    <title>VTG Dashboard</title>
    <style>
      /* Ставим тему до первой отрисовки, иначе мигнёт светлый фон */
      (function () {
        try {
          var t = localStorage.getItem('vtg-theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </style>
